name: pawnsteps
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pawnsteps
      POSTGRES_USER: pawnsteps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawnsteps -d pawnsteps"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${PAWNSTEPS_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://pawnsteps:${POSTGRES_PASSWORD}@database:5432/pawnsteps
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${PAWNSTEPS_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://pawnsteps:${POSTGRES_PASSWORD}@database:5432/pawnsteps
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: http://backend:8000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
